name: Render Video Nusantara

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "script/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare output folder
        run: mkdir -p output

      - name: Render 30-second video
        run: python src/render_video.py

      - name: Verify MP4 properties
        run: |
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json output/indonesia-military-video.mp4
          python - <<'PY'
          import json, subprocess
          p='output/indonesia-military-video.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=width,height,r_frame_rate','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          duration=float(d['format']['duration'])
          assert (int(v['width']),int(v['height']))==(1080,1920), v
          assert v['r_frame_rate']=='30/1', v
          assert abs(duration-30.0)<0.05, duration
          print('PASS: 1080x1920, 30 fps, 30 seconds')
          PY

      - name: Upload final MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: indonesia-military-video-1080x1920
          path: output/indonesia-military-video.mp4
          if-no-files-found: error
          retention-days: 30
